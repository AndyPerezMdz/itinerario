<!-- Supabase → Authentication → Emails → Change email address -->
<!-- Asunto: Confirma tu nuevo correo de Itinerario -->
<div style="font-family:Arial,Helvetica,sans-serif;max-width:480px;margin:0 auto;padding:32px 24px;color:#1c1917">
  <h1 style="font-size:22px;margin:0 0 4px;color:#1e3a8a">Itinerario</h1>
  <p style="margin:0 0 24px;color:#78716c;font-size:14px">Calendario de actividades</p>
  <p style="font-size:15px;line-height:1.5">Pediste cambiar tu correo de <b>{{ .Email }}</b> a <b>{{ .NewEmail }}</b>. Confírmalo aquí:</p>
  <p style="margin:28px 0">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email_change"
       style="background:#1e3a8a;color:#fff;text-decoration:none;padding:12px 22px;border-radius:8px;font-weight:bold;font-size:15px;display:inline-block">
      Confirmar mi correo nuevo
    </a>
  </p>
  <p style="font-size:13px;color:#78716c;line-height:1.5">Si no fuiste tú, ignora este correo. Tu cuenta sigue igual.</p>
</div>
